<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Scholar Tracker</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'"/>
  <style>
    :root{--ink:#0f1923;--paper:#f7f4ef;--cream:#ede8df;--gold:#c9a84c;--teal:#2a6b6b;}
    body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .card{border:1px solid var(--cream);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.07);padding:2.5rem;width:100%;max-width:420px;background:#fff;}
    .form-label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#555;}
    .form-control{border:1px solid var(--cream);border-radius:8px;padding:.7rem 1rem;font-size:.9rem;}
    .form-control:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15);}
    .btn-submit{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:.8rem;font-size:.9rem;font-weight:600;width:100%;}
    .btn-submit:hover{background:#1e3044;color:#fff;}
    .strength-bar{height:4px;border-radius:2px;background:var(--cream);margin-top:.4rem;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
    .hint{font-size:.75rem;color:#888;margin-top:.3rem;}
    .alert{border:none;border-radius:8px;font-size:.85rem;}
  </style>
</head>
<body>
<div class="card">
  <div style="text-align:center;margin-bottom:1.5rem;">
    <div style="display:inline-flex;align-items:center;gap:.5rem;background:#0f1923;border-radius:10px;padding:.6rem 1rem;margin-bottom:1rem;">
      <i class="fas fa-graduation-cap" style="color:#c9a84c;"></i>
      <span style="color:#fff;font-size:.8rem;font-weight:600;letter-spacing:.06em;">SCHOLAR TRACKER</span>
    </div>
    <h2 style="font-family:Georgia,serif;font-size:1.6rem;margin-bottom:.25rem;">Set New Password</h2>
    <p style="color:#888;font-size:.875rem;">Choose a strong password for your account.</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}{% for cat,msg in messages %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}{% endif %}{% endwith %}

  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="password" id="pw" class="form-control" placeholder="Min 8 chars, 1 letter, 1 number" required autofocus oninput="checkStrength(this.value)"/>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0;"></div></div>
      <div class="hint" id="strengthHint"></div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="password2" id="pw2" class="form-control" placeholder="Repeat new password" required/>
    </div>
    <button type="submit" class="btn-submit">
      <i class="fas fa-lock me-2"></i>Update Password
    </button>
  </form>

  <div style="text-align:center;margin-top:1.25rem;font-size:.85rem;color:#888;">
    <a href="{{ url_for('login') }}" style="color:var(--teal);">Back to sign in</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
function checkStrength(pw) {
  const fill = document.getElementById('strengthFill');
  const hint = document.getElementById('strengthHint');
  let score = 0;
  if (pw.length >= 8)             score++;
  if (/[A-Za-z]/.test(pw))        score++;
  if (/\d/.test(pw))               score++;
  if (/[^A-Za-z0-9]/.test(pw))    score++;
  if (pw.length >= 12)             score++;
  const levels = [
    {pct:'20%', color:'#c0392b', label:'Too short'},
    {pct:'40%', color:'#e67e22', label:'Weak'},
    {pct:'60%', color:'#f1c40f', label:'Fair'},
    {pct:'80%', color:'#27ae60', label:'Good'},
    {pct:'100%',color:'#1e7e47', label:'Strong'},
  ];
  const l = levels[Math.max(0, score - 1)] || levels[0];
  fill.style.width   = pw.length ? l.pct  : '0';
  fill.style.background = l.color;
  hint.textContent   = pw.length ? l.label : '';
}
</script>
</body>
</html>
